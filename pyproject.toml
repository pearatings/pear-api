[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pearatings"
dynamic = ["version"]
description = "Python client for the PEARatings college baseball and softball data API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PEARatings", email = "pearatings@gmail.com" }]
keywords = ["college baseball", "college softball", "ratings", "sports analytics", "api", "ncaa", "naia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "pandas>=1.3"]

[project.urls]
Homepage = "https://pearatings.com"
Pricing = "https://api.pearatings.com/billing"
Documentation = "https://api.pearatings.com/docs"
Source = "https://github.com/pearatings/pear-api"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "pearatings.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: calls a running PEARatings API (needs PEAR_API_KEY and PEAR_API_URL)"]
