[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pearatings"
dynamic = ["version"]
description = "Python client for the PEARatings college baseball and softball data API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "pandas>=1.3"]

[project.urls]
Homepage = "https://pearatings.com"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "pearatings.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: calls a running PEARatings API (needs PEAR_API_KEY and PEAR_API_URL)"]
